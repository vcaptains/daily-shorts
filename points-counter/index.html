<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points Counter</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1d2230; --muted:#6b7285; --accent:#4f46e5; --line:#e3e6ee; --win:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141c; --card:#1c1f2b; --text:#eceef5; --muted:#9097ab; --accent:#818cf8; --line:#2c3040; --win:#4ade80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,sans-serif; }
  h1 { margin:0 0 12px; font-size:1.4rem; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .wrap { overflow-x:auto; background:var(--card); border-radius:12px; border:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; min-width:max-content; }
  th, td { padding:6px; border-bottom:1px solid var(--line); text-align:center; }
  th.round, td.round { color:var(--muted); font-size:.85rem; position:sticky; left:0; background:var(--card); }
  input { width:84px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; text-align:center; }
  th input { font-weight:600; }
  tfoot td { font-weight:700; font-size:1.2rem; border-bottom:0; background:var(--bg); }
  tfoot td.round { background:var(--bg); color:var(--text); }
  td.win { color:var(--win); }
  .x { background:none; color:var(--muted); padding:2px 6px; }
</style>
</head>
<body>
<h1>Points Counter</h1>
<div class="bar">
  <button id="addPlayer">+ Player</button>
  <button id="addRound">+ Round</button>
  <button id="reset" class="ghost">Reset scores</button>
  <span id="count" style="align-self:center;color:var(--muted)"></span>
</div>
<div class="wrap"><table id="t"></table></div>

<script>
const MAX = 10;
let state;
try { state = JSON.parse(localStorage.getItem('pc') || 'null'); } catch (e) {}
if (!state) state = { names: ['Player 1', 'Player 2'], rounds: [[null, null]] };
const save = () => { try { localStorage.setItem('pc', JSON.stringify(state)); } catch (e) {} };

function totals() {
  return state.names.map((_, i) => state.rounds.reduce((s, r) => s + (Number(r[i]) || 0), 0));
}

function render() {
  const t = document.getElementById('t');
  t.innerHTML = '';
  const head = t.createTHead().insertRow();
  head.insertCell().outerHTML = '<th class="round">Round</th>';
  state.names.forEach((n, i) => {
    const th = document.createElement('th');
    const inp = Object.assign(document.createElement('input'), { value: n });
    inp.oninput = () => { state.names[i] = inp.value; save(); };
    const x = Object.assign(document.createElement('button'), { className: 'x', textContent: '✕', title: 'Remove player' });
    x.onclick = () => { if (state.names.length > 1) { state.names.splice(i, 1); state.rounds.forEach(r => r.splice(i, 1)); save(); render(); } };
    th.append(inp, x);
    head.appendChild(th);
  });
  const body = t.createTBody();
  state.rounds.forEach((r, ri) => {
    const row = body.insertRow();
    row.insertCell().outerHTML = `<td class="round">${ri + 1}</td>`;
    state.names.forEach((_, i) => {
      const inp = Object.assign(document.createElement('input'), { type: 'number', inputMode: 'decimal', value: r[i] ?? '' });
      inp.oninput = () => { r[i] = inp.value === '' ? null : Number(inp.value); save(); updateTotals(); };
      row.insertCell().appendChild(inp);
    });
  });
  const foot = t.createTFoot().insertRow();
  foot.insertCell().outerHTML = '<td class="round">Total</td>';
  state.names.forEach(() => foot.insertCell());
  document.getElementById('addPlayer').disabled = state.names.length >= MAX;
  document.getElementById('count').textContent = `${state.names.length}/${MAX} players`;
  updateTotals();
}

function updateTotals() {
  const tot = totals(), max = Math.max(...tot);
  const cells = document.querySelectorAll('#t tfoot td:not(.round)');
  cells.forEach((c, i) => { c.textContent = tot[i]; c.className = tot[i] === max && max > 0 ? 'win' : ''; });
}

document.getElementById('addPlayer').onclick = () => {
  if (state.names.length >= MAX) return;
  state.names.push('Player ' + (state.names.length + 1));
  state.rounds.forEach(r => r.push(null));
  save(); render();
};
document.getElementById('addRound').onclick = () => { state.rounds.push(state.names.map(() => null)); save(); render(); };
document.getElementById('reset').onclick = () => {
  if (confirm('Clear all scores?')) { state.rounds = [state.names.map(() => null)]; save(); render(); }
};
render();
</script>
</body>
</html>
